<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECO-IA Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           background: #0f172a; color: #e2e8f0; min-height: 100vh; }
    header { background: #1e293b; padding: 1rem 2rem;
             display: flex; align-items: center; gap: 1rem; border-bottom: 1px solid #334155; }
    header h1 { font-size: 1.5rem; color: #4ade80; }
    .badge { background: #166534; color: #4ade80; padding: 0.2rem 0.6rem;
             border-radius: 9999px; font-size: 0.75rem; font-weight: 600; }
    main { padding: 2rem; display: grid; gap: 1.5rem; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 0.75rem; padding: 1.5rem; }
    .card h2 { font-size: 1rem; color: #94a3b8; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .stat { font-size: 2rem; font-weight: 700; color: #f8fafc; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
    a { color: #60a5fa; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .links { display: flex; gap: 1rem; flex-wrap: wrap; }
    .btn { display: inline-block; padding: 0.5rem 1.25rem; border-radius: 0.5rem;
           background: #3b82f6; color: #fff; font-weight: 600; }
    .btn:hover { background: #2563eb; text-decoration: none; }
  </style>
</head>
<body>
  <header>
    <h1>🌱 ECO-IA</h1>
    <span class="badge">LIVE</span>
  </header>
  <main>
    <div class="card">
      <h2>System Status</h2>
      <div class="grid-3">
        <div><div class="stat" id="status">✅ Online</div><p>API Status</p></div>
        <div><div class="stat" id="uptime">—</div><p>Uptime</p></div>
        <div><div class="stat" id="version">1.0.0</div><p>Version</p></div>
      </div>
    </div>
    <div class="card">
      <h2>Quick Links</h2>
      <div class="links">
        <a href="/docs" class="btn">📄 API Docs</a>
        <a href="/redoc" class="btn">📚 ReDoc</a>
        <a href="/api/v1/admin/health" class="btn">🩺 Health</a>
        <a href="/api/v1/admin/metrics" class="btn">📊 Metrics</a>
      </div>
    </div>
  </main>
  <script>
    fetch('/health').then(r => r.json()).then(d => {
      document.getElementById('status').textContent = d.status === 'healthy' ? '✅ Online' : '⚠️ ' + d.status;
    });
  </script>
</body>
</html>
